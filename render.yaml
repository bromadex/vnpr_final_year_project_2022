services:
  - type: web
    name: vnpr-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn vnpr.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DJANGO_SETTINGS_MODULE
        value: vnpr.settings
      - key: DATABASE_URL
        fromDatabase:
          name: vnpr-db
          property: connectionString
      - key: GOOGLE_CLOUD_VISION_API_KEY
        value: placeholder-replace-in-dashboard
      - key: CORS_ALLOWED_ORIGINS
        value: "https://vnpr.vercel.app,https://vnpr-frontend.vercel.app"
    disk:
      name: vnpr-media
      mountPath: /app/media
      sizeGB: 1

databases:
  - name: vnpr-db
    plan: free
    databaseName: vnpr_db
    user: vnpr_user
